name: Build and Release

on:
  push:
    # This ensures the pipeline ONLY runs when you push a version tag like v1.0.0, v2.1.3, etc.
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release & Upload Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial! Gives the action permission to create a release and upload assets

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Go Toolchain
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Install Dependencies
      run: go mod download

    - name: Compile Windows Binary
      env:
        GOOS: windows
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o pkgrelease.exe main.go

    - name: Compile Linux Binary
      env:
        GOOS: linux
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o pkgrelease-linux main.go

    - name: Compile macOS Binary
      env:
        GOOS: darwin
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o pkgrelease-mac main.go

    - name: Publish GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Creates a release using the git tag name (e.g., v1.0.0) 
        # and automatically attaches the three compiled binaries to it
        gh release create ${{ github.ref_name }} \
          pkgrelease.exe \
          pkgrelease-linux \
          pkgrelease-mac \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes